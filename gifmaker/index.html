<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItsRede | FX GIF Maker</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 80px 20px;
            font-family: 'Helvetica', sans-serif;
            color: white;
            line-height: 1.8;
            background: linear-gradient(-45deg, #000000, #1a0000, #0a001a, #000000);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { 
            max-width: 600px; 
            width: 100%;
            margin: auto; 
            background: rgba(0,0,0,0.75); 
            padding: 40px; 
            border-radius: 20px; 
            backdrop-filter: blur(12px); 
            border: 1px solid #333; 
            box-sizing: border-box;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
        }

        h1 { 
            font-size: 2.2rem; 
            color: red; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-align: center; 
        }

        p.subtitle { 
            text-align: center; 
            color: #888; 
            font-size: 1rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dropzone {
            border: 2px dashed #400;
            border-radius: 12px;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: rgba(255,0,0,0.05);
            margin-bottom: 25px;
        }

        .dropzone.dragover {
            border-color: red;
            background: rgba(255,0,0,0.15);
        }

        .dropzone p {
            margin: 0;
            color: #aaa;
            font-size: 1rem;
        }

        .dropzone span {
            color: red;
            font-weight: bold;
        }

        input[type="file"] {
            display: none;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input[type="range"] {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #400;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        select:focus, input[type="range"]:focus {
            border-color: red;
        }

        input[type="range"] {
            padding: 0;
            accent-color: red;
            cursor: pointer;
            height: 6px;
            background: #222;
        }

        .range-value {
            float: right;
            color: red;
            font-weight: bold;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #600;
            background: red;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #cc0000;
            border-color: red;
            box-shadow: 0 0 15px rgba(255,0,0,0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #222;
            border-color: #333;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        #result {
            margin-top: 30px;
            text-align: center;
        }

        img {
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid #400;
            margin-top: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }

        .download-btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            background: rgba(255,0,0,0.1);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #400;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-sizing: border-box;
            text-align: center;
        }

        .download-btn:hover {
            background: red;
            border-color: red;
        }

        .status-text {
            color: #888;
            font-size: 0.95rem;
            margin-top: 15px;
            font-style: italic;
        }

        .back-home { 
            display: block; 
            text-align: center; 
            margin-top: 40px; 
            color: #666; 
            text-decoration: none; 
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s; 
        }
        .back-home:hover { color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>FX GIF Maker</h1>
        <p class="subtitle">Client-Side Custom Animation Studio</p>
        
        <div class="dropzone" id="dropzone">
            <p>Drag & drop your image here or <span id="browseTrigger">browse files</span></p>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <label for="effectType">Transition / Effect Mode</label>
        <select id="effectType">
            <option value="fade-black">Fade Out to Black</option>
            <option value="fade-white">Fade Out to White</option>
            <option value="pulse">Pulse Zoom Loop</option>
            <option value="glitch">Glitch / Shake Flash</option>
            <option value="grayscale">Grayscale Fade</option>
            <option value="blur">Blur Dissolve</option>
        </select>

        <div class="grid-row">
            <div>
                <label for="speedRange">Frame Duration <span id="speedVal" class="range-value">0.05s</span></label>
                <input type="range" id="speedRange" min="0.05" max="0.50" step="0.05" value="0.05">
            </div>
            <div>
                <label for="frameRange">Frames <span id="frameVal" class="range-value">15</span></label>
                <input type="range" id="frameRange" min="8" max="30" step="1" value="15">
            </div>
        </div>

        <button id="generateBtn" disabled>Generate GIF</button>
        
        <div id="result"></div>

        <a href="/" class="back-home">Return to Home</a>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const imageInput = document.getElementById('imageInput');
        const browseTrigger = document.getElementById('browseTrigger');
        const generateBtn = document.getElementById('generateBtn');
        const resultDiv = document.getElementById('result');
        
        const speedRange = document.getElementById('speedRange');
        const speedVal = document.getElementById('speedVal');
        const frameRange = document.getElementById('frameRange');
        const frameVal = document.getElementById('frameVal');
        
        let uploadedImage = null;

        speedRange.addEventListener('input', (e) => speedVal.textContent = parseFloat(e.target.value).toFixed(2) + 's');
        frameRange.addEventListener('input', (e) => frameVal.textContent = e.target.value);

        dropzone.addEventListener('click', () => imageInput.click());
        browseTrigger.addEventListener('click', (e) => { e.stopPropagation(); imageInput.click(); });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                uploadedImage = new Image();
                uploadedImage.onload = () => {
                    generateBtn.disabled = false;
                    dropzone.innerHTML = `<p style="color:white; font-weight:bold;">Loaded: ${file.name}</p>`;
                };
                uploadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        generateBtn.addEventListener('click', () => {
            if (!uploadedImage) return;

            generateBtn.disabled = true;
            generateBtn.textContent = 'Rendering Frames...';
            resultDiv.innerHTML = '<p class="status-text">Processing locally in browser...</p>';
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const maxDim = 350;
            let width = uploadedImage.width;
            let height = uploadedImage.height;
            if (width > height) {
                if (width > maxDim) { height *= maxDim / width; width = maxDim; }
            } else {
                if (height > maxDim) { width *= maxDim / height; height = height; width = maxDim * (width / height); } // Safe aspect scale
            }
            
            canvas.width = Math.floor(width);
            canvas.height = Math.floor(height);

            const frames = [];
            const totalFrames = parseInt(frameRange.value);
            const effectMode = document.getElementById('effectType').value;
            const frameInterval = parseFloat(speedRange.value);

            for (let i = 0; i <= totalFrames; i++) {
                ctx.save();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let progress = i / totalFrames;

                if (effectMode === 'fade-black') {
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalAlpha = 1 - progress;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                } 
                else if (effectMode === 'fade-white') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalAlpha = 1 - progress;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                } 
                else if (effectMode === 'pulse') {
                    let scale = 1 + Math.sin(progress * Math.PI * 2) * 0.15;
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.scale(scale, scale);
                    ctx.drawImage(uploadedImage, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                } 
                else if (effectMode === 'glitch') {
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                    if (i % 3 === 0) {
                        ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                        ctx.fillRect((Math.random() - 0.5) * 15, 0, canvas.width, canvas.height);
                    }
                } 
                else if (effectMode === 'grayscale') {
                    ctx.filter = `grayscale(${progress * 100}%)`;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                } 
                else if (effectMode === 'blur') {
                    ctx.filter = `blur(${progress * 12}px)`;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                }

                ctx.restore();
                frames.push(canvas.toDataURL('image/png'));
            }

            gifshot.createGIF({
                images: frames,
                interval: frameInterval,
                numFrames: totalFrames,
                width: canvas.width,
                height: canvas.height
            }, (obj) => {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate GIF';
                
                if (!obj.error) {
                    resultDiv.innerHTML = `
                        <img src="${obj.image}" alt="Generated Effect GIF">
                        <a href="${obj.image}" download="itsrede-fx.gif" class="download-btn">Download GIF</a>
                    `;
                } else {
                    resultDiv.innerHTML = '<p class="status-text" style="color:red;">Generation error. Try reducing frame count.</p>';
                }
            });
        });
    </script>
</body>
</html>
