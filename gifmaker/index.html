<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItsRede | Advanced FX GIF Studio</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 60px 20px;
            font-family: 'Helvetica', sans-serif;
            color: white;
            line-height: 1.8;
            background: linear-gradient(-45deg, #000000, #1a0000, #0a001a, #000000);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { 
            max-width: 800px; 
            width: 100%;
            margin: auto; 
            background: rgba(0,0,0,0.8); 
            padding: 40px; 
            border-radius: 20px; 
            backdrop-filter: blur(12px); 
            border: 1px solid #333; 
            box-sizing: border-box;
            box-shadow: 0 12px 50px rgba(0,0,0,0.9);
        }

        h1 { 
            font-size: 2.5rem; 
            color: red; 
            margin-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            text-align: center; 
        }

        p.subtitle { 
            text-align: center; 
            color: #888; 
            font-size: 0.95rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .dropzone {
            border: 2px dashed #400;
            border-radius: 12px;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: rgba(255,0,0,0.04);
            margin-bottom: 25px;
        }

        .dropzone.dragover {
            border-color: red;
            background: rgba(255,0,0,0.15);
        }

        .dropzone p {
            margin: 0;
            color: #aaa;
            font-size: 1rem;
        }

        .dropzone span {
            color: red;
            font-weight: bold;
        }

        input[type="file"] {
            display: none;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .control-group {
            margin-top: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            text-align: left;
            font-size: 0.75rem;
            color: #888;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        select, input[type="number"], input[type="range"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #400;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        select:focus, input[type="number"]:focus, input[type="range"]:focus {
            border-color: red;
        }

        input[type="range"] {
            padding: 0;
            accent-color: red;
            cursor: pointer;
            height: 6px;
            background: #222;
            margin-top: 10px;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .range-value {
            color: red;
            font-weight: bold;
        }

        button {
            width: 100%;
            margin-top: 35px;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #600;
            background: red;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #cc0000;
            border-color: red;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            background: #222;
            border-color: #333;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        #result {
            margin-top: 40px;
            text-align: center;
            border-top: 1px solid #222;
            padding-top: 30px;
        }

        /* Expanded larger preview container */
        .preview-wrapper {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        img {
            width: 100%;
            max-height: 650px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid #400;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8);
            background: #050507;
        }

        .download-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 20px auto 0 auto;
            padding: 14px;
            background: rgba(255,0,0,0.15);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #500;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-sizing: border-box;
            text-align: center;
        }

        .download-btn:hover {
            background: red;
            border-color: red;
            box-shadow: 0 0 15px rgba(255,0,0,0.4);
        }

        .status-text {
            color: #888;
            font-size: 1rem;
            margin-top: 15px;
            font-style: italic;
        }

        .back-home { 
            display: block; 
            text-align: center; 
            margin-top: 40px; 
            color: #666; 
            text-decoration: none; 
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s; 
        }
        .back-home:hover { color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>FX GIF Studio</h1>
        <p class="subtitle">High-Performance Pro Client-Side Generator</p>
        
        <div class="dropzone" id="dropzone">
            <p>Drag & drop your source asset here or <span id="browseTrigger">browse files</span></p>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <div class="controls-grid">
            <div class="control-group full-width">
                <label for="effectType">Transition / Effect Mode</label>
                <select id="effectType">
                    <option value="fade-black">Fade Out to Black</option>
                    <option value="fade-white">Fade Out to White</option>
                    <option value="fade-in-black">Fade In from Black</option>
                    <option value="fade-in-white">Fade In from White</option>
                    <option value="pulse">Pulse Zoom Loop</option>
                    <option value="glitch">Glitch / Shake Flash</option>
                    <option value="grayscale">Grayscale Fade</option>
                    <option value="blur">Blur Dissolve</option>
                    <option value="rgb-split">RGB Channel Split</option>
                    <option value="invert">Color Invert Flash</option>
                </select>
            </div>

            <div class="control-group">
                <label for="frameNumberInput">Total Frames (1 - 100)</label>
                <input type="number" id="frameNumberInput" min="5" max="100" value="30">
            </div>

            <div class="control-group">
                <label for="durationNumberInput">Total Duration (Seconds: Up to 60s)</label>
                <input type="number" id="durationNumberInput" min="0.5" max="60" step="0.5" value="3.0">
            </div>

            <div class="control-group full-width">
                <div class="range-header">
                    <label for="qualityRange" style="margin-bottom:0;">Resolution Quality Cap</label>
                    <span id="qualityVal" class="range-value">600px Width</span>
                </div>
                <input type="range" id="qualityRange" min="200" max="1000" step="50" value="600">
            </div>
        </div>

        <button id="generateBtn" disabled>Generate High-Res GIF</button>
        
        <div id="result"></div>

        <a href="/" class="back-home">Return to Home</a>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const imageInput = document.getElementById('imageInput');
        const browseTrigger = document.getElementById('browseTrigger');
        const generateBtn = document.getElementById('generateBtn');
        const resultDiv = document.getElementById('result');
        
        const frameNumberInput = document.getElementById('frameNumberInput');
        const durationNumberInput = document.getElementById('durationNumberInput');
        const qualityRange = document.getElementById('qualityRange');
        const qualityVal = document.getElementById('qualityVal');
        
        let uploadedImage = null;

        qualityRange.addEventListener('input', (e) => qualityVal.textContent = e.target.value + 'px Width');

        dropzone.addEventListener('click', () => imageInput.click());
        browseTrigger.addEventListener('click', (e) => { e.stopPropagation(); imageInput.click(); });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                uploadedImage = new Image();
                uploadedImage.onload = () => {
                    generateBtn.disabled = false;
                    dropzone.innerHTML = `<p style="color:white; font-weight:bold;">Loaded Asset: ${file.name} (${uploadedImage.width}x${uploadedImage.height}px)</p>`;
                };
                uploadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        generateBtn.addEventListener('click', () => {
            if (!uploadedImage) return;

            generateBtn.disabled = true;
            generateBtn.textContent = 'Rendering High-Quality Frames...';
            resultDiv.innerHTML = '<p class="status-text">Processing frames locally in your browser (up to 100 frames)...</p>';
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const maxDim = parseInt(qualityRange.value);
            let width = uploadedImage.width;
            let height = uploadedImage.height;
            if (width > height) {
                if (width > maxDim) { height *= maxDim / width; width = maxDim; }
            } else {
                if (height > maxDim) { width *= maxDim / height; height = maxDim; }
            }
            
            canvas.width = Math.floor(width);
            canvas.height = Math.floor(height);

            const frames = [];
            const totalFrames = Math.min(Math.max(parseInt(frameNumberInput.value) || 10, 5), 100);
            const totalDuration = Math.min(Math.max(parseFloat(durationNumberInput.value) || 3, 0.5), 60);
            
            // Calculate precise individual frame interval in seconds for gifshot
            const frameInterval = parseFloat((totalDuration / totalFrames).toFixed(3));
            const effectMode = document.getElementById('effectType').value;

            for (let i = 0; i < totalFrames; i++) {
                ctx.save();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let progress = i / (totalFrames - 1 || 1);

                if (effectMode === 'fade-black') {
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalAlpha = 1 - progress;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                } 
                else if (effectMode === 'fade-white') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalAlpha = 1 - progress;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                }
                else if (effectMode === 'fade-in-black') {
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalAlpha = progress;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                } 
                else if (effectMode === 'fade-in-white') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalAlpha = progress;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                } 
                else if (effectMode === 'pulse') {
                    let scale = 1 + Math.sin(progress * Math.PI * 2) * 0.18;
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.scale(scale, scale);
                    ctx.drawImage(uploadedImage, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                } 
                else if (effectMode === 'glitch') {
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                    if (i % 4 === 0) {
                        ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                        ctx.fillRect((Math.random() - 0.5) * 25, 0, canvas.width, canvas.height);
                    }
                } 
                else if (effectMode === 'grayscale') {
                    ctx.filter = `grayscale(${progress * 100}%)`;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                } 
                else if (effectMode === 'blur') {
                    ctx.filter = `blur(${progress * 16}px)`;
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                }
                else if (effectMode === 'rgb-split') {
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                    if (i % 2 === 0) {
                        ctx.globalCompositeOperation = 'screen';
                        ctx.fillStyle = 'rgba(255,0,0,0.5)';
                        ctx.fillRect(Math.sin(progress * Math.PI) * 10, 0, canvas.width, canvas.height);
                    }
                }
                else if (effectMode === 'invert') {
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                    if (Math.sin(progress * Math.PI * 4) > 0.5) {
                        ctx.globalCompositeOperation = 'difference';
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                }

                ctx.restore();
                frames.push(canvas.toDataURL('image/png'));
            }

            gifshot.createGIF({
                images: frames,
                interval: frameInterval,
                numFrames: totalFrames,
                width: canvas.width,
                height: canvas.height,
                gifWidth: canvas.width,
                gifHeight: canvas.height
            }, (obj) => {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate High-Res GIF';
                
                if (!obj.error) {
                    resultDiv.innerHTML = `
                        <div class="preview-wrapper">
                            <p style="color:#00ffcc; font-weight:bold; margin-bottom:10px;">✓ GIF Compiled Successfully (${canvas.width}x${canvas.height}px, ${totalFrames} Frames, ${totalDuration}s)</p>
                            <img src="${obj.image}" alt="High Resolution Generated FX GIF">
                            <a href="${obj.image}" download="itsrede-pro-fx.gif" class="download-btn">Download High-Res GIF</a>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = '<p class="status-text" style="color:red;">Generation error or memory limit reached. Try lowering resolution or frame count slightly.</p>';
                }
            });
        });
    </script>
</body>
</html>
