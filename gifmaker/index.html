    <style>
        :root {
            --bg-gradient: linear-gradient(-45deg, #000000, #1a0000, #0a001a, #000000);
            --container-bg: rgba(0, 0, 0, 0.85);
            --border-color: #333;
            --dropzone-bg: rgba(255, 0, 0, 0.04);
            --dropzone-border: #400;
            --text-main: #ffffff;
            --text-muted: #888888;
            --input-bg: rgba(0, 0, 0, 0.7);
            --accent-red: red;
            --accent-hover: #cc0000;
            --item-bg: rgba(255, 255, 255, 0.05);
        }

        body.light-mode {
            --bg-gradient: linear-gradient(-45deg, #f0f0f5, #e6e6fa, #ffe6e6, #f0f0f5);
            --container-bg: rgba(255, 255, 255, 0.9);
            --border-color: #d1d1d6;
            --dropzone-bg: rgba(255, 0, 0, 0.03);
            --dropzone-border: #ffb3b3;
            --text-main: #111111;
            --text-muted: #666666;
            --input-bg: rgba(255, 255, 255, 0.9);
            --accent-red: #d32f2f;
            --accent-hover: #b71c1c;
            --item-bg: rgba(0, 0, 0, 0.05);
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Helvetica', sans-serif;
            color: var(--text-main);
            line-height: 1.8;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .theme-toggle-btn {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-red);
        }

        .container { 
            max-width: 800px; 
            width: 100%;
            margin: auto; 
            background: var(--container-bg); 
            padding: 40px; 
            border-radius: 20px; 
            backdrop-filter: blur(12px); 
            border: 1px solid var(--border-color); 
            box-sizing: border-box;
            box-shadow: 0 12px 50px rgba(0,0,0,0.5);
            transition: background 0.3s, border-color 0.3s;
        }

        h1 { 
            font-size: 2.5rem; 
            color: var(--accent-red); 
            margin-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            text-align: center; 
        }

        p.subtitle { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 0.95rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .dropzone {
            border: 2px dashed var(--dropzone-border);
            border-radius: 12px;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: var(--dropzone-bg);
            margin-bottom: 20px;
        }

        .dropzone.dragover {
            border-color: var(--accent-red);
            background: rgba(255,0,0,0.15);
        }

        .dropzone p {
            margin: 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .dropzone span {
            color: var(--accent-red);
            font-weight: bold;
        }

        input[type="file"] {
            display: none;
        }

        /* File List Manager */
        .file-list {
            margin-bottom: 25px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .file-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .remove-file-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 6px;
            width: auto;
            margin: 0;
            line-height: 1;
        }

        .remove-file-btn:hover {
            color: #ff6b6b;
            box-shadow: none;
            background: none;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .control-group {
            margin-top: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            text-align: left;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        select, input[type="text"], input[type="number"], input[type="range"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--dropzone-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        select:focus, input[type="text"]:focus, input[type="number"]:focus, input[type="range"]:focus {
            border-color: var(--accent-red);
        }

        input[type="range"] {
            padding: 0;
            accent-color: var(--accent-red);
            cursor: pointer;
            height: 6px;
            background: #222;
            margin-top: 10px;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .range-value {
            color: var(--accent-red);
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--item-bg);
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-top: 15px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-red);
            cursor: pointer;
            margin: 0;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.85rem;
        }

        #errorBanner {
            display: none;
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid var(--accent-red);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .action-row {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--dropzone-border);
            background: var(--accent-red);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--accent-hover);
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(255,0,0,0.4);
        }

        button.secondary-btn {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        button.secondary-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            box-shadow: none;
        }

        button:disabled {
            background: #222;
            border-color: #333;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        #result {
            margin-top: 40px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
        }

        .preview-wrapper {
            width: 100%;
            max-width: 720px;
            margin: 0 auto 30px auto;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 25px;
        }

        img {
            width: 100%;
            max-height: 650px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid var(--dropzone-border);
            box-shadow: 0 10px 35px rgba(0,0,0,0.5);
            background: #050507;
        }

        .download-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 20px auto 0 auto;
            padding: 14px;
            background: rgba(255,0,0,0.15);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid var(--dropzone-border);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-sizing: border-box;
            text-align: center;
        }

        .download-btn:hover {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 0 15px rgba(255,0,0,0.4);
        }

        /* Support Section */
        .support-card {
            margin-top: 40px;
            padding: 20px;
            border-radius: 12px;
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .support-card h3 {
            margin: 0 0 8px 0;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.1rem;
        }

        .support-card p {
            margin: 0 0 15px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .paypal-btn {
            display: inline-block;
            padding: 10px 24px;
            background: #0070ba;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .paypal-btn:hover {
            background: #005ea6;
            box-shadow: 0 0 15px rgba(0, 112, 186, 0.5);
        }

        .back-home { 
            display: block; 
            text-align: center; 
            margin-top: 40px; 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s; 
        }
        .back-home:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="theme-toggle-btn" id="themeToggleBtn">☀️ Switch to Light Mode</button>
    </div>

    <div class="container">
        <h1>FX GIF Studio</h1>
        <p class="subtitle">High-Performance Pro Client-Side Generator</p>
        
        <div class="dropzone" id="dropzone">
            <p id="dropzoneText">Drag & drop source images here or <span id="browseTrigger">browse files</span> (Infinite uploads allowed)</p>
            <input type="file" id="imageInput" accept="image/*" multiple>
        </div>

        <div class="file-list" id="fileList"></div>
        
        <div class="controls-grid">
            <div class="control-group full-width">
                <label for="effectType">Transition / Effect Mode</label>
                <select id="effectType">
                    <option value="fade-black">Fade Out to Black</option>
                    <option value="fade-white">Fade Out to White</option>
                    <option value="white-fade-out-hd">White Fade Out (HD)</option>
                    <option value="fade-in-black">Fade In from Black</option>
                    <option value="fade-in-white">Fade In from White</option>
                    <option value="pulse">Pulse Zoom Loop</option>
                    <option value="glitch">Glitch / Shake Flash</option>
                    <option value="grayscale">Grayscale Fade</option>
                    <option value="blur">Blur Dissolve</option>
                    <option value="rgb-split">RGB Channel Split</option>
                    <option value="invert">Color Invert Flash</option>
                </select>
            </div>

            <div class="control-group full-width">
                <label for="captionInput">Text Caption / Watermark Overlay (Optional)</label>
                <input type="text" id="captionInput" placeholder="e.g., itsrede.uk or @ItsRede" value="">
            </div>

            <div class="control-group">
                <label for="captionPosition">Caption Position</label>
                <select id="captionPosition">
                    <option value="bottom">Bottom Overlay</option>
                    <option value="top">Top Overlay</option>
                    <option value="center">Center Stamp</option>
                </select>
            </div>

            <div class="control-group">
                <label for="frameNumberInput">Total Frames (5 - 40)</label>
                <input type="number" id="frameNumberInput" min="5" max="40" value="20">
            </div>

            <div class="control-group">
                <label for="customWidthInput">Custom Width (px) - Optional</label>
                <input type="number" id="customWidthInput" placeholder="Auto (e.g., 400)" min="50" max="2000">
            </div>

            <div class="control-group">
                <label for="customHeightInput">Custom Height (px) - Optional</label>
                <input type="number" id="customHeightInput" placeholder="Auto (e.g., 400)" min="50" max="2000">
            </div>

            <div class="control-group">
                <label for="durationNumberInput">Total Duration (Seconds)</label>
                <input type="number" id="durationNumberInput" min="0.5" max="60" step="0.5" value="3.0">
            </div>

            <div class="control-group">
                <label for="delayInput">Start Effect at (Seconds)</label>
                <input type="number" id="delayInput" min="0" max="60" step="0.5" value="0.0">
            </div>

            <div class="control-group full-width">
                <div class="range-header">
                    <label for="qualityRange" style="margin-bottom:0;">Default Resolution Quality Cap (If custom sizes blank)</label>
                    <span id="qualityVal" class="range-value">500px Max</span>
                </div>
                <input type="range" id="qualityRange" min="200" max="800" step="50" value="500">
            </div>

            <div class="control-group full-width">
                <div class="checkbox-group" onclick="document.getElementById('batchModeToggle').click(); event.stopPropagation();" style="margin-bottom: 10px;">
                    <input type="checkbox" id="batchModeToggle" checked>
                    <label for="batchModeToggle"><b>Batch Mode:</b> Process each image into its own separate GIF</label>
                </div>
                <div class="checkbox-group" onclick="document.getElementById('holdFrameToggle').click(); event.stopPropagation();">
                    <input type="checkbox" id="holdFrameToggle" checked>
                    <label for="holdFrameToggle">Hold initial frame static until effect delay starts</label>
                </div>
            </div>
        </div>

        <div id="errorBanner"></div>

        <div class="action-row">
            <button id="resetAssetsBtn" class="secondary-btn" style="display:none;">Clear All Assets</button>
            <button id="generateBtn" disabled>Generate High-Res GIF(s)</button>
        </div>
        
        <div id="result"></div>

        <!-- Support The Creator Section -->
        <div class="support-card">
            <h3>Support The Creator!</h3>
            <p>If you enjoy using FX GIF Studio, consider supporting future updates and serverless tools.</p>
            <a href="https://paypal.me/itsrede" target="_blank" rel="noopener noreferrer" class="paypal-btn">💙 Support via PayPal</a>
        </div>

        <a href="/" class="back-home">Return to Home</a>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const dropzoneText = document.getElementById('dropzoneText');
        const imageInput = document.getElementById('imageInput');
        const browseTrigger = document.getElementById('browseTrigger');
        const fileListContainer = document.getElementById('fileList');
        const generateBtn = document.getElementById('generateBtn');
        const resetAssetsBtn = document.getElementById('resetAssetsBtn');
        const errorBanner = document.getElementById('errorBanner');
        const resultDiv = document.getElementById('result');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const holdFrameToggle = document.getElementById('holdFrameToggle');
        const batchModeToggle = document.getElementById('batchModeToggle');
        
        const captionInput = document.getElementById('captionInput');
        const captionPosition = document.getElementById('captionPosition');
        const frameNumberInput = document.getElementById('frameNumberInput');
        const durationNumberInput = document.getElementById('durationNumberInput');
        const delayInput = document.getElementById('delayInput');
        const qualityRange = document.getElementById('qualityRange');
        const qualityVal = document.getElementById('qualityVal');
        const customWidthInput = document.getElementById('customWidthInput');
        const customHeightInput = document.getElementById('customHeightInput');
        
        let loadedAssets = [];

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeToggleBtn.textContent = document.body.classList.contains('light-mode') 
                ? '🌙 Switch to Dark Mode' 
                : '☀️ Switch to Light Mode';
        });

        qualityRange.addEventListener('input', (e) => qualityVal.textContent = e.target.value + 'px Max');

        function validateInputs() {
            let frames = parseInt(frameNumberInput.value);
            let duration = parseFloat(durationNumberInput.value);
            let delay = parseFloat(delayInput.value);

            let errorMsg = "";

            if (isNaN(frames) || frames < 5 || frames > 40) {
                errorMsg = "ERROR: Total Frames must be between 5 and 40 for optimal browser performance.";
            } else if (isNaN(duration) || duration <= 0 || duration > 60) {
                errorMsg = "ERROR: Total Duration must be between 0.5 and 60 seconds.";
            } else if (isNaN(delay) || delay < 0) {
                errorMsg = "ERROR: Start Effect timestamp cannot be negative.";
            } else if (delay >= duration) {
                errorMsg = "ERROR: Start Effect time cannot be greater than or equal to Total Duration.";
            }

            if (errorMsg) {
                errorBanner.textContent = errorMsg;
                errorBanner.style.display = 'block';
                generateBtn.disabled = true;
                return false;
            } else {
                errorBanner.style.display = 'none';
                if (loadedAssets.length > 0) generateBtn.disabled = false;
                return true;
            }
        }

        [frameNumberInput, durationNumberInput, delayInput, customWidthInput, customHeightInput].forEach(input => {
            input.addEventListener('input', validateInputs);
        });

        dropzone.addEventListener('click', () => imageInput.click());
        browseTrigger.addEventListener('click', (e) => { e.stopPropagation(); imageInput.click(); });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFiles(files);
        });

        imageInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) handleFiles(files);
        });

        function handleFiles(files) {
            Array.from(files).forEach((file) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        loadedAssets.push({
                            id: Date.now() + Math.random(),
                            file: file,
                            img: img
                        });
                        renderFileList();
                        validateInputs();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function renderFileList() {
            fileListContainer.innerHTML = '';
            if (loadedAssets.length === 0) {
                resetAssetsBtn.style.display = 'none';
                generateBtn.disabled = true;
                dropzoneText.innerHTML = `Drag & drop source images here or <span id="browseTrigger">browse files</span> (Infinite uploads allowed)`;
                return;
            }

            resetAssetsBtn.style.display = 'block';
            dropzoneText.innerHTML = `<span style="color:var(--accent-red); font-weight:bold;">✓ ${loadedAssets.length} asset(s) loaded. Add more or manage below:</span>`;

            loadedAssets.forEach((asset, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'file-item';
                itemDiv.innerHTML = `
                    <span class="file-name">${index + 1}. ${asset.file.name}</span>
                    <button class="remove-file-btn" data-id="${asset.id}" title="Remove file">✕</button>
                `;
                fileListContainer.appendChild(itemDiv);
            });

            document.querySelectorAll('.remove-file-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idToRemove = parseFloat(e.target.getAttribute('data-id'));
                    loadedAssets = loadedAssets.filter(a => a.id !== idToRemove);
                    renderFileList();
                    validateInputs();
                });
            });
        }

        resetAssetsBtn.addEventListener('click', () => {
            loadedAssets = [];
            imageInput.value = '';
            renderFileList();
            resultDiv.innerHTML = '';
            errorBanner.style.display = 'none';
        });

        generateBtn.addEventListener('click', () => {
            if (!validateInputs() || loadedAssets.length === 0) return;

            generateBtn.disabled = true;
            resultDiv.innerHTML = '';
            
            const isBatch = batchModeToggle.checked;
            const maxDim = parseInt(qualityRange.value);
            const totalFrames = parseInt(frameNumberInput.value);
            const totalDuration = parseFloat(durationNumberInput.value);
            const startDelay = parseFloat(delayInput.value);
            const shouldHold = holdFrameToggle.checked;
            const frameInterval = parseFloat((totalDuration / totalFrames).toFixed(3));
            const effectMode = document.getElementById('effectType').value;
            const captionText = captionInput.value.trim();
            const pos = captionPosition.value;

            const userWidth = parseInt(customWidthInput.value);
            const userHeight = parseInt(customHeightInput.value);

            let assetsToProcess = isBatch ? loadedAssets : [null]; 
            let currentAssetIdx = 0;

            function processNextAssetTarget() {
                if (currentAssetIdx >= assetsToProcess.length) {
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate High-Res GIF(s)';
                    return;
                }

                let targetAsset = assetsToProcess[currentAssetIdx];
                let currentImageName = targetAsset ? targetAsset.file.name : "combined-sequence";
                
                generateBtn.textContent = `Processing ${currentAssetIdx + 1} of ${assetsToProcess.length}...`;
                let statusP = document.createElement('p');
                statusP.className = 'status-text';
                statusP.style.color = '#00ffcc';
                statusP.textContent = `Rendering frames for: ${currentImageName}...`;
                resultDiv.appendChild(statusP);

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                let sampleImg = isBatch ? targetAsset.img : loadedAssets[0].img;
                let width = sampleImg.width;
                let height = sampleImg.height;

                // Calculate Custom or Auto Dimensions
                if (!isNaN(userWidth) && !isNaN(userHeight)) {
                    width = userWidth;
                    height = userHeight;
                } else if (!isNaN(userWidth)) {
                    height = (userWidth / width) * height;
                    width = userWidth;
                } else if (!isNaN(userHeight)) {
                    width = (userHeight / height) * width;
                    height = userHeight;
                } else {
                    if (width > height) {
                        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                    } else {
                        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                    }
                }
                
                canvas.width = Math.floor(width);
                canvas.height = Math.floor(height);

                const frames = [];
                let currentFrameIndex = 0;

                function renderSingleFrame() {
                    if (currentFrameIndex >= totalFrames) {
                        compileSingleGIF(canvas, frames, currentImageName, statusP);
                        return;
                    }

                    let i = currentFrameIndex;
                    ctx.save();
                    ctx.filter = 'none';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    let currentTime = i * frameInterval;
                    let activeImage;

                    if (isBatch) {
                        activeImage = targetAsset.img;
                    } else {
                        if (shouldHold && currentTime < startDelay) {
                            activeImage = loadedAssets[0].img;
                        } else {
                            let currentImgIndex = Math.floor((currentTime / totalDuration) * loadedAssets.length);
                            if (currentImgIndex >= loadedAssets.length) currentImgIndex = loadedAssets.length - 1;
                            activeImage = loadedAssets[currentImgIndex].img;
                        }
                    }

                    if (currentTime < startDelay && isBatch && shouldHold) {
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                    } else if (currentTime < startDelay && !isBatch) {
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                    } else {
                        let activeDuration = Math.max(totalDuration - startDelay, frameInterval);
                        let activeTime = currentTime - startDelay;
                        let progress = Math.min(Math.max(activeTime / activeDuration, 0), 1);

                        if (effectMode === 'fade-black') {
                            ctx.fillStyle = '#000000';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.globalAlpha = 1 - progress;
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                        } 
                        else if (effectMode === 'fade-white') {
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.globalAlpha = 1 - progress;
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                        }
                        else if (effectMode === 'white-fade-out-hd') {
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                            ctx.fillStyle = '#ffffff';
                            ctx.globalAlpha = progress;
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                        }
                        else if (effectMode === 'fade-in-black') {
                            ctx.fillStyle = '#000000';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.globalAlpha = progress;
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                        } 
                        else if (effectMode === 'fade-in-white') {
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.globalAlpha = progress;
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                        } 
                        else if (effectMode === 'pulse') {
                            let scale = 1 + Math.sin(progress * Math.PI * 2) * 0.18;
                            ctx.translate(canvas.width / 2, canvas.height / 2);
                            ctx.scale(scale, scale);
                            ctx.drawImage(activeImage, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                        } 
                        else if (effectMode === 'glitch') {
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                            if (i % 4 === 0) {
                                ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                                ctx.fillRect((Math.random() - 0.5) * 25, 0, canvas.width, canvas.height);
                            }
                        } 
                        else if (effectMode === 'grayscale') {
                            ctx.filter = `grayscale(${progress * 100}%)`;
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                            ctx.filter = 'none';
                        } 
                        else if (effectMode === 'blur') {
                            ctx.filter = `blur(${progress * 16}px)`;
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                            ctx.filter = 'none';
                        }
                        else if (effectMode === 'rgb-split') {
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                            if (i % 2 === 0) {
                                ctx.globalCompositeOperation = 'screen';
                                ctx.fillStyle = 'rgba(255,0,0,0.5)';
                                ctx.fillRect(Math.sin(progress * Math.PI) * 10, 0, canvas.width, canvas.height);
                            }
                        }
                        else if (effectMode === 'invert') {
                            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                            if (Math.sin(progress * Math.PI * 4) > 0.5) {
                                ctx.globalCompositeOperation = 'difference';
                                ctx.fillStyle = 'white';
                                ctx.fillRect(0, 0, canvas.width, canvas.height);
                            }
                        }
                    }

                    if (captionText) {
                        ctx.restore();
                        ctx.save();
                        
                        let fontSize = Math.max(Math.floor(canvas.width / 20), 16);
                        ctx.font = `bold ${fontSize}px Helvetica, sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        
                        let x = canvas.width / 2;
                        let y = canvas.height - 30;
                        if (pos === 'top') y = 30 + (fontSize / 2);
                        if (pos === 'center') y = canvas.height / 2;

                        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                        let metrics = ctx.measureText(captionText);
                        let padding = 12;
                        ctx.fillRect(x - (metrics.width / 2) - padding, y - (fontSize / 2) - (padding / 2), metrics.width + (padding * 2), fontSize + padding);

                        ctx.fillStyle = '#ffffff';
                        ctx.fillText(captionText, x, y);
                    }

                    ctx.restore();
                    frames.push(canvas.toDataURL('image/png'));

                    currentFrameIndex++;
                    requestAnimationFrame(renderSingleFrame);
                }

                requestAnimationFrame(renderSingleFrame);
            }

            function compileSingleGIF(canvas, frames, imageName, statusP) {
                gifshot.createGIF({
                    images: frames,
                    interval: frameInterval,
                    numFrames: totalFrames,
                    width: canvas.width,
                    height: canvas.height,
                    gifWidth: canvas.width,
                    gifHeight: canvas.height
                }, (obj) => {
                    statusP.remove();
                    if (!obj.error) {
                        let safeName = imageName.replace(/\.[^/.]+$/, "");
                        let wrapper = document.createElement('div');
                        wrapper.className = 'preview-wrapper';
                        wrapper.innerHTML = `
                            <p style="color:#00ffcc; font-weight:bold; margin-bottom:10px;">✓ Compiled: ${imageName} (${canvas.width}x${canvas.height}px)</p>
                            <img src="${obj.image}" alt="Generated FX GIF">
                            <a href="${obj.image}" download="itsrede-${safeName}-fx.gif" class="download-btn">Download GIF: ${imageName}</a>
                        `;
                        resultDiv.appendChild(wrapper);
                    } else {
                        let errP = document.createElement('p');
                        errP.style.color = 'red';
                        errP.textContent = `Error compiling ${imageName}. Try lowering frame count or resolution.`;
                        resultDiv.appendChild(errP);
                    }

                    currentAssetIdx++;
                    
                    // MEMORY YIELD: Small timeout prevents browser thread locking between batch items
                    setTimeout(processNextAssetTarget, 100);
                });
            }

            processNextAssetTarget();
        });
    </script>
</body>
</html>
