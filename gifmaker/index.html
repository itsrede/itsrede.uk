<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItsRede | Advanced FX GIF Studio</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 60px 20px;
            font-family: 'Helvetica', sans-serif;
            color: white;
            line-height: 1.8;
            background: linear-gradient(-45deg, #000000, #1a0000, #0a001a, #000000);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { 
            max-width: 800px; 
            width: 100%;
            margin: auto; 
            background: rgba(0,0,0,0.85); 
            padding: 40px; 
            border-radius: 20px; 
            backdrop-filter: blur(12px); 
            border: 1px solid #333; 
            box-sizing: border-box;
            box-shadow: 0 12px 50px rgba(0,0,0,0.9);
        }

        h1 { 
            font-size: 2.5rem; 
            color: red; 
            margin-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            text-align: center; 
        }

        p.subtitle { 
            text-align: center; 
            color: #888; 
            font-size: 0.95rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .dropzone {
            border: 2px dashed #400;
            border-radius: 12px;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: rgba(255,0,0,0.04);
            margin-bottom: 25px;
        }

        .dropzone.dragover {
            border-color: red;
            background: rgba(255,0,0,0.15);
        }

        .dropzone p {
            margin: 0;
            color: #aaa;
            font-size: 1rem;
        }

        .dropzone span {
            color: red;
            font-weight: bold;
        }

        input[type="file"] {
            display: none;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .control-group {
            margin-top: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            text-align: left;
            font-size: 0.75rem;
            color: #888;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        select, input[type="text"], input[type="number"], input[type="range"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #400;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        select:focus, input[type="text"]:focus, input[type="number"]:focus, input[type="range"]:focus {
            border-color: red;
        }

        input[type="range"] {
            padding: 0;
            accent-color: red;
            cursor: pointer;
            height: 6px;
            background: #222;
            margin-top: 10px;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .range-value {
            color: red;
            font-weight: bold;
        }

        #errorBanner {
            display: none;
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid red;
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .action-row {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #600;
            background: red;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #cc0000;
            border-color: red;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }

        button.secondary-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            color: #aaa;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        button.secondary-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: #666;
            box-shadow: none;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            background: #222;
            border-color: #333;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        #result {
            margin-top: 40px;
            text-align: center;
            border-top: 1px solid #222;
            padding-top: 30px;
        }

        .preview-wrapper {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        img {
            width: 100%;
            max-height: 650px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid #400;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8);
            background: #050507;
        }

        .download-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 20px auto 0 auto;
            padding: 14px;
            background: rgba(255,0,0,0.15);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #500;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-sizing: border-box;
            text-align: center;
        }

        .download-btn:hover {
            background: red;
            border-color: red;
            box-shadow: 0 0 15px rgba(255,0,0,0.4);
        }

        .status-text {
            color: #888;
            font-size: 1rem;
            margin-top: 15px;
            font-style: italic;
        }

        .back-home { 
            display: block; 
            text-align: center; 
            margin-top: 40px; 
            color: #666; 
            text-decoration: none; 
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s; 
        }
        .back-home:hover { color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>FX GIF Studio</h1>
        <p class="subtitle">High-Performance Pro Client-Side Generator</p>
        
        <div class="dropzone" id="dropzone">
            <p id="dropzoneText">Drag & drop source images here or <span id="browseTrigger">browse files</span> (Multiple allowed)</p>
            <input type="file" id="imageInput" accept="image/*" multiple>
        </div>
        
        <div class="controls-grid">
            <div class="control-group full-width">
                <label for="effectType">Transition / Effect Mode</label>
                <select id="effectType">
                    <option value="fade-black">Fade Out to Black</option>
                    <option value="fade-white">Fade Out to White</option>
                    <option value="fade-in-black">Fade In from Black</option>
                    <option value="fade-in-white">Fade In from White</option>
                    <option value="pulse">Pulse Zoom Loop</option>
                    <option value="glitch">Glitch / Shake Flash</option>
                    <option value="grayscale">Grayscale Fade</option>
                    <option value="blur">Blur Dissolve</option>
                    <option value="rgb-split">RGB Channel Split</option>
                    <option value="invert">Color Invert Flash</option>
                </select>
            </div>

            <div class="control-group full-width">
                <label for="captionInput">Text Caption / Watermark Overlay (Optional)</label>
                <input type="text" id="captionInput" placeholder="e.g., itsrede.uk or @ItsRede" value="">
            </div>

            <div class="control-group">
                <label for="captionPosition">Caption Position</label>
                <select id="captionPosition">
                    <option value="bottom">Bottom Overlay</option>
                    <option value="top">Top Overlay</option>
                    <option value="center">Center Stamp</option>
                </select>
            </div>

            <div class="control-group">
                <label for="frameNumberInput">Total Frames (5 - 100)</label>
                <input type="number" id="frameNumberInput" min="5" max="100" value="30">
            </div>

            <div class="control-group">
                <label for="durationNumberInput">Total Duration (Seconds)</label>
                <input type="number" id="durationNumberInput" min="0.5" max="60" step="0.5" value="3.0">
            </div>

            <div class="control-group">
                <label for="delayInput">Start Effect at (Seconds)</label>
                <input type="number" id="delayInput" min="0" max="60" step="0.5" value="0.0">
            </div>

            <div class="control-group">
                <div class="range-header">
                    <label for="qualityRange" style="margin-bottom:0;">Resolution Quality Cap</label>
                    <span id="qualityVal" class="range-value">600px Width</span>
                </div>
                <input type="range" id="qualityRange" min="200" max="1000" step="50" value="600">
            </div>
        </div>

        <div id="errorBanner"></div>

        <div class="action-row">
            <button id="resetAssetsBtn" class="secondary-btn" style="display:none;">Replace Assets</button>
            <button id="generateBtn" disabled>Generate High-Res GIF</button>
        </div>
        
        <div id="result"></div>

        <a href="/" class="back-home">Return to Home</a>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const dropzoneText = document.getElementById('dropzoneText');
        const imageInput = document.getElementById('imageInput');
        const browseTrigger = document.getElementById('browseTrigger');
        const generateBtn = document.getElementById('generateBtn');
        const resetAssetsBtn = document.getElementById('resetAssetsBtn');
        const errorBanner = document.getElementById('errorBanner');
        const resultDiv = document.getElementById('result');
        
        const captionInput = document.getElementById('captionInput');
        const captionPosition = document.getElementById('captionPosition');
        const frameNumberInput = document.getElementById('frameNumberInput');
        const durationNumberInput = document.getElementById('durationNumberInput');
        const delayInput = document.getElementById('delayInput');
        const qualityRange = document.getElementById('qualityRange');
        const qualityVal = document.getElementById('qualityVal');
        
        let loadedImages = [];

        qualityRange.addEventListener('input', (e) => qualityVal.textContent = e.target.value + 'px Width');

        function validateInputs() {
            let frames = parseInt(frameNumberInput.value);
            let duration = parseFloat(durationNumberInput.value);
            let delay = parseFloat(delayInput.value);

            let errorMsg = "";

            if (isNaN(frames) || frames < 5 || frames > 100) {
                errorMsg = "ERROR: Total Frames must be between 5 and 100.";
            } else if (isNaN(duration) || duration <= 0 || duration > 60) {
                errorMsg = "ERROR: Total Duration must be between 0.5 and 60 seconds.";
            } else if (isNaN(delay) || delay < 0) {
                errorMsg = "ERROR: Start Effect timestamp cannot be negative.";
            } else if (delay >= duration) {
                errorMsg = "ERROR: Start Effect time cannot be greater than or equal to Total Duration.";
            }

            if (errorMsg) {
                errorBanner.textContent = errorMsg;
                errorBanner.style.display = 'block';
                generateBtn.disabled = true;
                return false;
            } else {
                errorBanner.style.display = 'none';
                if (loadedImages.length > 0) {
                    generateBtn.disabled = false;
                }
                return true;
            }
        }

        [frameNumberInput, durationNumberInput, delayInput].forEach(input => {
            input.addEventListener('input', validateInputs);
        });

        dropzone.addEventListener('click', () => imageInput.click());
        browseTrigger.addEventListener('click', (e) => { e.stopPropagation(); imageInput.click(); });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFiles(files);
        });

        imageInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) handleFiles(files);
        });

        function handleFiles(files) {
            loadedImages = [];
            let loadedCount = 0;
            
            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        loadedImages[index] = img;
                        loadedCount++;
                        if (loadedCount === files.length) {
                            loadedImages = loadedImages.filter(Boolean);
                            resetAssetsBtn.style.display = 'block';
                            dropzoneText.innerHTML = `<span style="color:#00ffcc;">✓ Loaded ${loadedImages.length} asset(s) successfully. Click to replace.</span>`;
                            validateInputs();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        resetAssetsBtn.addEventListener('click', () => {
            loadedImages = [];
            imageInput.value = '';
            generateBtn.disabled = true;
            resetAssetsBtn.style.display = 'none';
            dropzoneText.innerHTML = `Drag & drop source images here or <span id="browseTrigger">browse files</span> (Multiple allowed)`;
            resultDiv.innerHTML = '';
            errorBanner.style.display = 'none';
        });

        generateBtn.addEventListener('click', () => {
            if (!validateInputs() || loadedImages.length === 0) return;

            generateBtn.disabled = true;
            generateBtn.textContent = 'Rendering High-Quality Frames...';
            resultDiv.innerHTML = '<p class="status-text">Processing frames locally...</p>';
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const maxDim = parseInt(qualityRange.value);
            let width = loadedImages[0].width;
            let height = loadedImages[0].height;
            if (width > height) {
                if (width > maxDim) { height *= maxDim / width; width = maxDim; }
            } else {
                if (height > maxDim) { width *= maxDim / height; height = maxDim; }
            }
            
            canvas.width = Math.floor(width);
            canvas.height = Math.floor(height);

            const frames = [];
            const totalFrames = parseInt(frameNumberInput.value);
            const totalDuration = parseFloat(durationNumberInput.value);
            const startDelay = parseFloat(delayInput.value);
            
            const frameInterval = parseFloat((totalDuration / totalFrames).toFixed(3));
            const effectMode = document.getElementById('effectType').value;
            const captionText = captionInput.value.trim();
            const pos = captionPosition.value;

            for (let i = 0; i < totalFrames; i++) {
                ctx.save();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let currentTime = i * frameInterval;
                let currentImgIndex = Math.floor((currentTime / totalDuration) * loadedImages.length);
                if (currentImgIndex >= loadedImages.length) currentImgIndex = loadedImages.length - 1;
                let activeImage = loadedImages[currentImgIndex];

                if (currentTime < startDelay) {
                    ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                } else {
                    let activeDuration = Math.max(totalDuration - startDelay, frameInterval);
                    let activeTime = currentTime - startDelay;
                    let progress = Math.min(Math.max(activeTime / activeDuration, 0), 1);

                    if (effectMode === 'fade-black') {
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.globalAlpha = 1 - progress;
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                    } 
                    else if (effectMode === 'fade-white') {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.globalAlpha = 1 - progress;
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                    }
                    else if (effectMode === 'fade-in-black') {
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.globalAlpha = progress;
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                    } 
                    else if (effectMode === 'fade-in-white') {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.globalAlpha = progress;
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                    } 
                    else if (effectMode === 'pulse') {
                        let scale = 1 + Math.sin(progress * Math.PI * 2) * 0.18;
                        ctx.translate(canvas.width / 2, canvas.height / 2);
                        ctx.scale(scale, scale);
                        ctx.drawImage(activeImage, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                    } 
                    else if (effectMode === 'glitch') {
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                        if (i % 4 === 0) {
                            ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                            ctx.fillRect((Math.random() - 0.5) * 25, 0, canvas.width, canvas.height);
                        }
                    } 
                    else if (effectMode === 'grayscale') {
                        ctx.filter = `grayscale(${progress * 100}%)`;
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                    } 
                    else if (effectMode === 'blur') {
                        ctx.filter = `blur(${progress * 16}px)`;
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                    }
                    else if (effectMode === 'rgb-split') {
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                        if (i % 2 === 0) {
                            ctx.globalCompositeOperation = 'screen';
                            ctx.fillStyle = 'rgba(255,0,0,0.5)';
                            ctx.fillRect(Math.sin(progress * Math.PI) * 10, 0, canvas.width, canvas.height);
                        }
                    }
                    else if (effectMode === 'invert') {
                        ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
                        if (Math.sin(progress * Math.PI * 4) > 0.5) {
                            ctx.globalCompositeOperation = 'difference';
                            ctx.fillStyle = 'white';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                        }
                    }
                }

                if (captionText) {
                    ctx.restore();
                    ctx.save();
                    
                    let fontSize = Math.max(Math.floor(canvas.width / 20), 16);
                    ctx.font = `bold ${fontSize}px Helvetica, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    let x = canvas.width / 2;
                    let y = canvas.height - 30;
                    if (pos === 'top') y = 30 + (fontSize / 2);
                    if (pos === 'center') y = canvas.height / 2;

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                    let metrics = ctx.measureText(captionText);
                    let padding = 12;
                    ctx.fillRect(x - (metrics.width / 2) - padding, y - (fontSize / 2) - (padding / 2), metrics.width + (padding * 2), fontSize + padding);

                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(captionText, x, y);
                }

                ctx.restore();
                frames.push(canvas.toDataURL('image/png'));
            }

            gifshot.createGIF({
                images: frames,
                interval: frameInterval,
                numFrames: totalFrames,
                width: canvas.width,
                height: canvas.height,
                gifWidth: canvas.width,
                gifHeight: canvas.height
            }, (obj) => {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate High-Res GIF';
                
                if (!obj.error) {
                    resultDiv.innerHTML = `
                        <div class="preview-wrapper">
                            <p style="color:#00ffcc; font-weight:bold; margin-bottom:10px;">✓ GIF Compiled Successfully (${canvas.width}x${canvas.height}px, ${loadedImages.length} Image(s), ${totalFrames} Frames, ${totalDuration}s)</p>
                            <img src="${obj.image}" alt="High Resolution Generated FX GIF">
                            <a href="${obj.image}" download="itsrede-pro-fx.gif" class="download-btn">Download High-Res GIF</a>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = '<p class="status-text" style="color:red;">Generation error or memory limit reached. Try lowering resolution or frame count slightly.</p>';
                }
            });
        });
    </script>
</body>
</html>
